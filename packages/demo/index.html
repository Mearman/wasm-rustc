<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wasm-rustc demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace; }
    body {
      font-family: var(--font-mono);
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr 1fr;
      gap: 0;
    }
    #toolbar {
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #181825;
      border-bottom: 1px solid #313244;
    }
    #toolbar h1 { font-size: 0.9rem; font-weight: 600; }
    #toolbar button {
      padding: 0.25rem 0.75rem;
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    #toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    #progress-container {
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #a6adc8;
    }
    #progress-bar {
      width: 120px;
      height: 4px;
      background: #313244;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: #89b4fa;
      width: 0%;
      transition: width 0.3s;
    }
    #editor-container {
      overflow: hidden;
    }
    .cm-editor { height: 100%; }
    #output {
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      overflow: auto;
      border-top: 1px solid #313244;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #output .stderr { color: #f38ba8; }
    #output .stdout { color: #a6e3a1; }
    #output .info { color: #89b4fa; }
    #status {
      margin-left: auto;
      font-size: 0.7rem;
      color: #585b70;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>wasm-rustc</h1>
    <button id="compile-btn" disabled>Compile</button>
    <div id="progress-container">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text">0%</span>
    </div>
    <span id="status">loading...</span>
  </div>
  <div id="editor-container"></div>
  <div id="output"><span class="info">Loading compiler...</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
